info:
  name: KoMeet API
  description: >
    Collection Postman moderne en YAML pour l'API KoMeet.
    Configure l'authentification Bearer JWT au niveau de la collection
    et sauvegarde automatiquement le jeton JWT (`accessToken`) dès la connexion
    ou l'inscription pour alimenter toutes les requêtes authentifiées.
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json

variable:
  - key: baseUrl
    value: http://localhost:8080
    type: string
  - key: accessToken
    value: ""
    type: string
  - key: testEmail
    value: student@komeet.fr
    type: string
  - key: testPassword
    value: SecretPassword123!
    type: string
  - key: testProfileId
    value: ""
    type: string
  - key: createdUserId
    value: ""
    type: string

auth:
  type: bearer
  bearer:
    - key: token
      value: "{{accessToken}}"
      type: string

item:
  - name: 1. Health
    item:
      - name: GET /health
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/health"
            host:
              - "{{baseUrl}}"
            path:
              - health
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Health status is healthy', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.status).to.eql('healthy');"
                - "    pm.expect(json.database).to.eql('UP');"
                - "});"

      - name: GET /api/v1/health
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/health"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - health
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"

  - name: 2. Authentication
    item:
      - name: Register User
        request:
          auth:
            type: noauth
          method: POST
          header:
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "email": "{{testEmail}}",
                "password": "{{testPassword}}",
                "displayName": "Etudiant KoMeet"
              }
          url:
            raw: "{{baseUrl}}/api/v1/auth/register"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - auth
              - register
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 201 or 409 if already registered', function () {"
                - "    pm.expect(pm.response.code).to.be.oneOf([201, 409]);"
                - "    if (pm.response.code === 201) {"
                - "        var json = pm.response.json();"
                - "        pm.expect(json.accessToken).to.be.a('string');"
                - "        // Sauvegarde du jeton de session JWT"
                - "        pm.environment.set('accessToken', json.accessToken);"
                - "        pm.collectionVariables.set('accessToken', json.accessToken);"
                - "        pm.environment.set('createdUserId', json.user.id);"
                - "        pm.collectionVariables.set('createdUserId', json.user.id);"
                - "    }"
                - "});"

      - name: Login User (Saves JWT Session Token)
        request:
          auth:
            type: noauth
          method: POST
          header:
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "email": "{{testEmail}}",
                "password": "{{testPassword}}"
              }
          url:
            raw: "{{baseUrl}}/api/v1/auth/login"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - auth
              - login
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Login returns JWT token and saves to session', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.accessToken).to.be.a('string');"
                - "    pm.expect(json.tokenType).to.eql('Bearer');"
                - "    // Sauvegarde automatique du jeton pour toutes les requêtes suivantes"
                - "    pm.environment.set('accessToken', json.accessToken);"
                - "    pm.collectionVariables.set('accessToken', json.accessToken);"
                - "    pm.environment.set('createdUserId', json.user.id);"
                - "    pm.collectionVariables.set('createdUserId', json.user.id);"
                - "    console.log('JWT Session token saved successfully!');"
                - "});"

      - name: Login Failure - Bad Credentials
        request:
          auth:
            type: noauth
          method: POST
          header:
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "email": "{{testEmail}}",
                "password": "MauvaisMotDePasse!"
              }
          url:
            raw: "{{baseUrl}}/api/v1/auth/login"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - auth
              - login
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 401', function () {"
                - "    pm.response.to.have.status(401);"
                - "});"
                - "pm.test('Error code is INVALID_CREDENTIALS', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.error.code).to.eql('INVALID_CREDENTIALS');"
                - "});"

      - name: Logout (Clears JWT Session Token)
        request:
          auth:
            type: noauth
          method: POST
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/auth/logout"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - auth
              - logout
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"

  - name: 3. Users
    item:
      - name: Get /users/me (Uses JWT Session Token)
        request:
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/users/me"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - users
              - me
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Response does not leak password hash', function () {"
                - "    var text = pm.response.text();"
                - "    pm.expect(text).to.not.include('passwordHash');"
                - "});"

      - name: Get /users/me Without Token (Should Fail 401)
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/users/me"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - users
              - me
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 401', function () {"
                - "    pm.response.to.have.status(401);"
                - "});"
                - "pm.test('Error code is UNAUTHORIZED', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.error.code).to.eql('UNAUTHORIZED');"
                - "});"

      - name: Patch /users/me (Uses JWT Session Token)
        request:
          method: PATCH
          header:
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "displayName": "Etudiant KoMeet Mis à Jour"
              }
          url:
            raw: "{{baseUrl}}/api/v1/users/me"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - users
              - me
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('DisplayName updated', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.displayName).to.eql('Etudiant KoMeet Mis à Jour');"
                - "});"

  - name: 4. Profiles
    item:
      - name: List Profiles (Paginated)
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/profiles?page=1&pageSize=10"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - profiles
            query:
              - key: page
                value: "1"
              - key: pageSize
                value: "10"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Pagination structure is present and saves profile ID', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.items).to.be.an('array');"
                - "    pm.expect(json.pagination).to.be.an('object');"
                - "    if (json.items.length > 0) {"
                - "        pm.environment.set('testProfileId', json.items[0].id);"
                - "        pm.collectionVariables.set('testProfileId', json.items[0].id);"
                - "    }"
                - "});"
                - "pm.test('Profile includes gender and French country', function () {"
                - "    var json = pm.response.json();"
                - "    if (json.items.length > 0) {"
                - "        pm.expect(json.items[0].gender).to.be.a('string');"
                - "        pm.expect(json.items[0].country).to.eql('France');"
                - "    }"
                - "});"
                - "pm.test('Profile includes French phone and location details', function () {"
                - "    var json = pm.response.json();"
                - "    if (json.items.length > 0) {"
                - "        var p = json.items[0];"
                - "        pm.expect(p.location).to.be.an('object');"
                - "        pm.expect(p.location.city).to.be.a('string');"
                - "        pm.expect(p.location.country).to.eql('France');"
                - "        pm.expect(p.location.department).to.be.a('string');"
                - "        pm.expect(p.phone).to.be.a('string');"
                - "    }"
                - "});"

      - name: Filter Profiles (Age & Sort)
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/profiles?minAge=20&maxAge=50&sort=age&order=asc"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - profiles
            query:
              - key: minAge
                value: "20"
              - key: maxAge
                value: "50"
              - key: sort
                value: age
              - key: order
                value: asc
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"

      - name: Get Profile By ID
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/profiles/{{testProfileId}}"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - profiles
              - "{{testProfileId}}"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Profile id matches', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.id).to.eql(pm.variables.get('testProfileId'));"
                - "});"
                - "pm.test('Profile includes gender', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.gender).to.be.a('string');"
                - "});"
                - "pm.test('Profile includes French phone and location details', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.location).to.be.an('object');"
                - "    pm.expect(json.location.city).to.be.a('string');"
                - "    pm.expect(json.location.country).to.eql('France');"
                - "    pm.expect(json.phone).to.be.a('string');"
                - "});"

      - name: Get Inexistent Profile (Should Fail 404)
        request:
          auth:
            type: noauth
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/profiles/non-existent-profile-id-12345"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - profiles
              - non-existent-profile-id-12345
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 404', function () {"
                - "    pm.response.to.have.status(404);"
                - "});"
                - "pm.test('Error code is PROFILE_NOT_FOUND', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.error.code).to.eql('PROFILE_NOT_FOUND');"
                - "});"

  - name: 5. Favorites
    item:
      - name: Add Favorite (Uses JWT Session Token)
        request:
          method: POST
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/favorites/{{testProfileId}}"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - favorites
              - "{{testProfileId}}"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 201', function () {"
                - "    pm.response.to.have.status(201);"
                - "});"
                - "pm.test('Returns favorite profile', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.profile.id).to.eql(pm.variables.get('testProfileId'));"
                - "});"

      - name: Add Same Favorite Again (Idempotent)
        request:
          method: POST
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/favorites/{{testProfileId}}"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - favorites
              - "{{testProfileId}}"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 201', function () {"
                - "    pm.response.to.have.status(201);"
                - "});"

      - name: Get User Favorites (Uses JWT Session Token)
        request:
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/favorites"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - favorites
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Contains added favorite', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.items.length).to.be.above(0);"
                - "});"

      - name: Delete Favorite (Uses JWT Session Token)
        request:
          method: DELETE
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/favorites/{{testProfileId}}"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - favorites
              - "{{testProfileId}}"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"

      - name: Delete Inexistent Favorite (Should Fail 404)
        request:
          method: DELETE
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/favorites/{{testProfileId}}"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - favorites
              - "{{testProfileId}}"
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 404', function () {"
                - "    pm.response.to.have.status(404);"
                - "});"
                - "pm.test('Error code is FAVORITE_NOT_FOUND', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.error.code).to.eql('FAVORITE_NOT_FOUND');"
                - "});"

  - name: 6. Preferences
    item:
      - name: Get User Preferences (Defaults or Saved)
        request:
          method: GET
          header: []
          url:
            raw: "{{baseUrl}}/api/v1/preferences"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - preferences
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Has default minAge and maxAge', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.minAge).to.be.a('number');"
                - "    pm.expect(json.maxAge).to.be.a('number');"
                - "});"

      - name: Update User Preferences (PUT)
        request:
          method: PUT
          header:
            - key: Content-Type
              value: application/json
          body:
            mode: raw
            raw: |-
              {
                "minAge": 22,
                "maxAge": 38,
                "country": "France"
              }
          url:
            raw: "{{baseUrl}}/api/v1/preferences"
            host:
              - "{{baseUrl}}"
            path:
              - api
              - v1
              - preferences
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - "pm.test('Status code is 200', function () {"
                - "    pm.response.to.have.status(200);"
                - "});"
                - "pm.test('Preferences updated', function () {"
                - "    var json = pm.response.json();"
                - "    pm.expect(json.minAge).to.eql(22);"
                - "    pm.expect(json.maxAge).to.eql(38);"
                - "    pm.expect(json.country).to.eql('France');"
                - "});"
