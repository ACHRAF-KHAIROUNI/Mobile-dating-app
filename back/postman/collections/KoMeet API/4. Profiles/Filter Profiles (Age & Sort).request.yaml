$kind: http-request
url: "{{baseUrl}}/api/v1/profiles?minAge=20&maxAge=50&sort=age&order=asc"
method: GET
queryParams:
  minAge: "20"
  maxAge: "50"
  sort: age
  order: asc
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
